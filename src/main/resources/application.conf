ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.example.ApplicationKt.module ]
    }
}

jwt {
    secret = "local-development-secret-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "ktor-task-app"
    audience = "ktor-task-users"
    realm = "Task API"
    expiresInSeconds = 3600
}

